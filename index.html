<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONICCRYPT | Sender</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>

    <main class="container">

        <header>
            <div class="logo">SONICCRYPT</div>
            <div class="subtitle">ACOUSTIC DATA TRANSMISSION</div>
        </header>

        <section class="card">

            <div class="section-title">
                TRANSMISSION TEST
            </div>

            <label for="message">
                MESSAGE
            </label>

            <textarea
                id="message"
                maxlength="255"
                placeholder="Enter a message..."
            >HELLO SONICCRYPT</textarea>

            <div class="message-info">
                Maximum 255 bytes
            </div>

            <button id="sendButton">
                SEND MESSAGE
            </button>

            <button id="stopButton" class="secondary" disabled>
                STOP
            </button>

        </section>

        <section class="card">

            <div class="section-title">
                TRANSMISSION STATUS
            </div>

            <div class="status-box" id="status">
                READY
            </div>

            <div class="stats">

                <div class="stat">
                    <span class="stat-label">PROTOCOL</span>
                    <span class="stat-value">2-FSK</span>
                </div>

                <div class="stat">
                    <span class="stat-label">BIT 0</span>
                    <span class="stat-value">1200 Hz</span>
                </div>

                <div class="stat">
                    <span class="stat-label">BIT 1</span>
                    <span class="stat-value">2400 Hz</span>
                </div>

                <div class="stat">
                    <span class="stat-label">SYMBOL</span>
                    <span class="stat-value">100 ms</span>
                </div>

            </div>

            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <div id="progressText">
                0%
            </div>

        </section>

        <section class="card log-card">

            <div class="section-title">
                TRANSMITTER LOG
            </div>

            <div id="log"></div>

        </section>

        <footer>
            SONICCRYPT TEST PROTOCOL v1
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
